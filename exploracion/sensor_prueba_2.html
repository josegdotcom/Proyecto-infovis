<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba acelerómetro</title>
</head>

<body>

<h2>Prueba de acelerómetro</h2>

<button onclick="iniciar()">Activar sensores</button>

<p>Ax: <span id="ax">0</span></p>
<p>Ay: <span id="ay">0</span></p>
<p>Az: <span id="az">0</span></p>

<script>

async function iniciar() {

    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {
        const permiso = await DeviceMotionEvent.requestPermission();

        if (permiso !== "granted") {
            alert("Permiso de movimiento rechazado");
            return;
        }
    }

    window.addEventListener("devicemotion", (event) => {

        const a = event.accelerationIncludingGravity;

        document.getElementById("ax").textContent =
            a?.x ?? "null";

        document.getElementById("ay").textContent =
            a?.y ?? "null";

        document.getElementById("az").textContent =
            a?.z ?? "null";

        // Enviar datos al PC
        fetch("/api/prueba_2/sensor", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                timestamp: Date.now(),
                ax: a?.x ?? 0,
                ay: a?.y ?? 0,
                az: a?.z ?? 0,
                gx: event.rotationRate?.alpha ?? 0,
                gy: event.rotationRate?.beta ?? 0,
                gz: event.rotationRate?.gamma ?? 0
            })
        })
        .then(r => console.log("Datos enviados:", r.status))
        .catch(e => console.error("Error enviando:", e));

    });

    alert("Sensor activado");
}

</script>

</body>
</html>
